<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Test From Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .info {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
        }
        
        .info-item {
            margin: 10px 0;
            font-size: 14px;
        }
        
        .info-label {
            font-weight: bold;
            color: #667eea;
            display: inline-block;
            min-width: 120px;
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border-radius: 6px;
            border-left: 4px solid #e74c3c;
        }
        
        .loading {
            color: #667eea;
            margin-top: 20px;
        }
    </style>
</head>
<body>
  <div class="container">
      <h1>📍 Geolocation Test From Client</h1>
      <button id="getLocationBtn" onclick="getLocation()">Get My Location</button>
      
      <div id="loading" class="loading" style="display: none;">
          Getting your location...
      </div>
      
      <div id="info" class="info" style="display: none;">
          <div class="info-item">
              <span class="info-label">Latitude:</span>
              <span id="latitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Longitude:</span>
              <span id="longitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Accuracy:</span>
              <span id="accuracy">-</span> meters
          </div>
          <div class="info-item">
              <span class="info-label">Altitude:</span>
              <span id="altitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Altitude Accuracy:</span>
              <span id="altitudeAccuracy">-</span> meters
          </div>
          <div class="info-item">
              <span class="info-label">Heading:</span>
              <span id="heading">-</span>°
          </div>
          <div class="info-item">
              <span class="info-label">Speed:</span>
              <span id="speed">-</span> m/s
          </div>
          <div class="info-item">
              <span class="info-label">Timestamp:</span>
              <span id="timestamp">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Country:</span>
              <span id="country">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Address:</span>
              <span id="address">-</span>
          </div>
      </div>
      
      <div id="error" class="error" style="display: none;"></div>

      <button onclick="window.location.href='index.html'" style="margin-top: 20px;">Go Back</button>
  </div>

  <script> 
      function getLocation() {
          const btn = document.getElementById('getLocationBtn');
          const info = document.getElementById('info');
          const error = document.getElementById('error');
          const loading = document.getElementById('loading');
          
          // Reset UI
          btn.disabled = true;
          loading.style.display = 'block';
          info.style.display = 'none';
          error.style.display = 'none';
          
          // Check if geolocation is supported
          if (!navigator.geolocation) {
              showError('Geolocation is not supported by your browser.');
              btn.disabled = false;
              loading.style.display = 'none';
              return;
          }
          
          // Get current position
          navigator.geolocation.getCurrentPosition(
              function(position) {
                  // Success callback
                  displayLocation(position);
                  btn.disabled = false;
              },
              function(err) {
                  // Error callback
                  let errorMsg = 'Unable to retrieve your location. ';
                  switch(err.code) {
                      case err.PERMISSION_DENIED:
                          errorMsg += 'Permission denied. Please allow location access.';
                          break;
                      case err.POSITION_UNAVAILABLE:
                          errorMsg += 'Location information is unavailable.';
                          break;
                      case err.TIMEOUT:
                          errorMsg += 'The request to get your location timed out.';
                          break;
                      default:
                          errorMsg += 'An unknown error occurred.';
                          break;
                  }
                  showError(errorMsg);
                  btn.disabled = false;
                  loading.style.display = 'none';
              },
              {
                  enableHighAccuracy: true,
                  timeout: 10000,
                  maximumAge: 0
              }
          );
      }
      
      async function displayLocation(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          document.getElementById('latitude').textContent = lat.toFixed(6);
          document.getElementById('longitude').textContent = lng.toFixed(6);
          document.getElementById('accuracy').textContent = Math.round(position.coords.accuracy);
          document.getElementById('altitude').textContent = position.coords.altitude ? position.coords.altitude.toFixed(2) + ' m' : 'Not available';
          document.getElementById('altitudeAccuracy').textContent = position.coords.altitudeAccuracy ? Math.round(position.coords.altitudeAccuracy) : 'Not available';
          document.getElementById('heading').textContent = position.coords.heading ? Math.round(position.coords.heading) : 'Not available';
          document.getElementById('speed').textContent = position.coords.speed ? position.coords.speed.toFixed(2) : 'Not available';
          document.getElementById('timestamp').textContent = new Date(position.timestamp).toLocaleString();
          
          // Fetch country name and address
          document.getElementById('country').textContent = 'Loading...';
          document.getElementById('address').textContent = 'Loading...';
          
          try {
              const locationData = await getCountryFromCoordinates(lat, lng);
              document.getElementById('country').textContent = locationData.country || 'Not available';
              document.getElementById('address').textContent = locationData.address || 'Not available';
          } catch (error) {
              document.getElementById('country').textContent = 'Error loading';
              document.getElementById('address').textContent = 'Error loading';
              console.error('Error fetching location data:', error);
          }
          
          document.getElementById('info').style.display = 'block';
          document.getElementById('loading').style.display = 'none';
      }
      
      async function getCountryFromCoordinates(latitude, longitude) {
          // Using OpenStreetMap Nominatim API for reverse geocoding (free, no API key required)
          const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`;
          
          try {
              const response = await fetch(url, {
                  headers: {
                      'User-Agent': 'GeoLookupApp/1.0' // Required by Nominatim
                  }
              });
              
              if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
              }
              
              const data = await response.json();
              
              // Extract country name and formatted address
              const country = data.address?.country || data.address?.country_code?.toUpperCase() || 'Unknown';
              const address = data.display_name || 'Address not available';
              
              return {
                  country: country,
                  address: address
              };
          } catch (error) {
              console.error('Reverse geocoding error:', error);
              throw error;
          }
      }
      
      async function lookupCoordinates() {
          const latInput = document.getElementById('latInput');
          const lngInput = document.getElementById('lngInput');
          const btn = document.getElementById('lookupBtn');
          const loading = document.getElementById('loading');
          const info = document.getElementById('info');
          const error = document.getElementById('error');
          
          const lat = parseFloat(latInput.value);
          const lng = parseFloat(lngInput.value);
          
          // Validate inputs
          if (isNaN(lat) || isNaN(lng)) {
              showError('Please enter valid latitude and longitude values.');
              return;
          }
          
          if (lat < -90 || lat > 90) {
              showError('Latitude must be between -90 and 90.');
              return;
          }
          
          if (lng < -180 || lng > 180) {
              showError('Longitude must be between -180 and 180.');
              return;
          }
          
          // Reset UI
          btn.disabled = true;
          loading.style.display = 'block';
          info.style.display = 'none';
          error.style.display = 'none';
          
          try {
              // Create a mock position object for display
              const mockPosition = {
                  coords: {
                      latitude: lat,
                      longitude: lng,
                      accuracy: null,
                      altitude: null,
                      altitudeAccuracy: null,
                      heading: null,
                      speed: null
                  },
                  timestamp: Date.now()
              };
              
              await displayLocation(mockPosition);
              btn.disabled = false;
              loading.style.display = 'none';
          } catch (err) {
              showError('Failed to lookup location. Please try again.');
              btn.disabled = false;
              loading.style.display = 'none';
          }
      }
      
      function showError(message) {
          const error = document.getElementById('error');
          error.textContent = message;
          error.style.display = 'block';
      }
  </script>
</body>
</html>
