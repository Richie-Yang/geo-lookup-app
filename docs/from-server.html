<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Test From Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .info {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
        }
        
        .info-item {
            margin: 10px 0;
            font-size: 14px;
        }
        
        .info-label {
            font-weight: bold;
            color: #667eea;
            display: inline-block;
            min-width: 120px;
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border-radius: 6px;
            border-left: 4px solid #e74c3c;
        }
        
        .loading {
            color: #667eea;
            margin-top: 20px;
        }
    </style>
</head>
<body>  
  <div class="container">
      <h1>📍 Geolocation Test From Server</h1>      
      <div id="info" class="info" style="display: none;">
          <div class="info-item">
              <span class="info-label">Latitude:</span>
              <span id="latitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Longitude:</span>
              <span id="longitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Accuracy:</span>
              <span id="accuracy">-</span> meters
          </div>
          <div class="info-item">
              <span class="info-label">Altitude:</span>
              <span id="altitude">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Altitude Accuracy:</span>
              <span id="altitudeAccuracy">-</span> meters
          </div>
          <div class="info-item">
              <span class="info-label">Heading:</span>
              <span id="heading">-</span>°
          </div>
          <div class="info-item">
              <span class="info-label">Speed:</span>
              <span id="speed">-</span> m/s
          </div>
          <div class="info-item">
              <span class="info-label">Timestamp:</span>
              <span id="timestamp">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Country:</span>
              <span id="country">-</span>
          </div>
          <div class="info-item">
              <span class="info-label">Address:</span>
              <span id="address">-</span>
          </div>
      </div>
      
      <div id="error" class="error" style="display: none;"></div>

      <button onclick="window.location.href='index.html'" style="margin-top: 20px;">Go Back</button>
  </div>

  <script>
      getLocation();
      const APP_URL = "https://geo-lookup-app-361306888123.asia-east1.run.app"
      function getLocation() {
        fetch(APP_URL + '/lookup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        })
        .then(response => response.json())
        .then(data => {
          console.log(data);
          document.getElementById('info').style.display = 'block';
          document.getElementById('country').textContent = data.country;
        })
        .catch(error => {
          console.error('Error fetching location data:', error);
          showError('Error fetching location data: ' + error.message);
        });
      }

      function showError(message) {
          const error = document.getElementById('error');
          error.textContent = message;
          error.style.display = 'block';
      }
  </script>
</body>
</html>
